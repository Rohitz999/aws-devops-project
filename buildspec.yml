version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: eu-central-1
    IMAGE_REPO_NAME: ecommerce/frontend/prod
    CONTAINER_NAME: aws-devops-container

phases:

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."

      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

      - export IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

      - export REPOSITORY_URI=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME

      - echo "Repository URI: $REPOSITORY_URI"

      - docker --version

      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin https://$REPOSITORY_URI

  build:
    commands:
      - echo "Build started on $(date)"

      - ls -la

      - echo "Building Docker image..."

      - 'docker build -t "$IMAGE_REPO_NAME:$IMAGE_TAG" .'

      - echo "Tagging Docker image..."

      - 'docker tag "$IMAGE_REPO_NAME:$IMAGE_TAG" "$REPOSITORY_URI:$IMAGE_TAG"'

  post_build:
    commands:
      - echo "Pushing Docker image to ECR..."

      - 'docker push "$REPOSITORY_URI:$IMAGE_TAG"'

      - echo "Creating imagedefinitions.json..."

      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json

      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
    - appspec.yml
    - taskdef.json
