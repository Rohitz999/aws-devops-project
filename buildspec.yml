version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: eu-central-1
    IMAGE_REPO_NAME: ecommerce/frontend/prod
    CONTAINER_NAME: aws-devops-container

phases:

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."

      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

      - export IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

      - REPOSITORY_URI=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME

      - echo "Repository URI:"
      - echo $REPOSITORY_URI

      - echo "Docker Version:"
      - docker --version

      - echo "Docker Info:"
      - docker info

      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin https://$REPOSITORY_URI

  build:
    commands:
      - echo "Build started on $(date)"

      - echo "Current Directory:"
      - pwd

      - echo "Listing Files:"
      - ls -la

      - echo "Building Docker image..."
      - docker build -t $IMAGE_REPO_NAME .

      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo "Pushing Docker image..."

      - docker push $REPOSITORY_URI:$IMAGE_TAG

      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
    - appspec.yml
    - taskdef.json
