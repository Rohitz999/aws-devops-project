<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS DevOps Project</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      background: rgba(255, 255, 255, 0.08);
      padding: 50px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.8;
      color: #e2e8f0;
      margin-bottom: 30px;
    }

    .tech-stack {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .badge {
      background-color: #2563eb;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      background-color: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.3s ease;
    }

    .btn:hover {
      background-color: #0ea5e9;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🚀 AWS DevOps Project</h1>

    <p>
      Production-ready DevOps deployment using AWS, Docker,
      Kubernetes, Terraform, and CI/CD pipelines.
    </p>

    <div class="tech-stack">
      <div class="badge">AWS</div>
      <div class="badge">Docker</div>
      <div class="badge">Kubernetes</div>
      <div class="badge">Terraform</div>
      <div class="badge">Jenkins</div>
      <div class="badge">GitHub Actions</div>
    </div>

    <a href="https://www.linkedin.com/" class="btn" target="_blank">
      Connect on LinkedIn
    </a>

    <footer>
      Built with ❤️ for Cloud & DevOps Learning and Love
    </footer>

  </div>

</body>
</html>
